<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seamless Dash - Seamex</title>
    <style>
        :root { --red: #A01018; --gold: #FFC107; --sky: #e3f2fd; --blue: #0984e3; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 2; width: 100%; height: 100%; }

        /* UI Layer */
        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; align-items: center; justify-content: center; }
        .screen-box { 
            background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 30px; width: 88%; max-width: 360px; 
            text-align: center; pointer-events: auto; box-shadow: 0 15px 45px rgba(0,0,0,0.15); 
            border-top: 8px solid var(--red); display: none; flex-direction: column; max-height: 90vh; overflow-y: auto;
        }

        body.state-menu #start-screen { display: flex; }
        body.state-gameover #game-over-screen { display: flex; }
        body.state-playing #game-hud { display: flex !important; }

        .logo { width: 130px; margin: 0 auto 10px; }
        .title { color: var(--red); font-size: 24px; font-weight: 900; margin: 0; text-transform: uppercase; }
        
        /* Form & Buttons */
        input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        .main-btn { background: linear-gradient(135deg, var(--gold), var(--red)); color: white; border: none; padding: 16px; border-radius: 50px; font-weight: 800; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; box-shadow: 0 5px 15px rgba(160,16,24,0.2); }
        .main-btn:disabled { opacity: 0.5; filter: grayscale(1); }
        .text-btn { background: none; border: none; color: var(--red); font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 13px; text-decoration: underline; }

        /* HUD */
        #game-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; z-index: 5; }
        .hud-top { position: absolute; top: 15px; width: 92%; left: 4%; display: flex; justify-content: space-between; }
        .stat-pill { background: rgba(255,255,255,0.9); padding: 8px 15px; border-radius: 20px; font-weight: 800; color: var(--red); font-size: 12px; border: 1px solid #eee; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        #shield-toast { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: var(--blue); color: white; padding: 6px 18px; border-radius: 30px; font-weight: 800; font-size: 12px; display: none; box-shadow: 0 4px 15px rgba(9,132,227,0.3); }

        .how-to { background: #f0f9ff; padding: 15px; border-radius: 15px; margin: 15px 0; text-align: left; border: 1px solid #d1e9ff; }
        .how-item { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 6px; font-weight: 600; color: #444; }

        .lb { background: #f8f9fa; border-radius: 15px; padding: 12px; margin: 10px 0; font-size: 13px; border: 1px solid #eee; }
        .lb-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body class="state-menu">

    <div style="display:none;">
        <img id="asset-player" src="character.png">
        <img id="asset-v1" src="icons8-virus-60.png">
        <img id="asset-v2" src="icons8-virus-60 (1).png">
        <img id="asset-shield" src="sheild.png">
    </div>

    <div id="ui-layer">
        <div id="start-screen" class="screen-box">
            <img src="NEW Seamex logo.png" class="logo">
            <h1 class="title">Seamless Dash</h1>
            
            <div id="welcome-back" style="display:none; margin:15px 0;">
                <div style="font-size:14px; background: #f0f7ff; padding: 10px; border-radius: 12px;">Good morning, <strong id="user-name"></strong></div>
                <button class="main-btn" id="btn-quick-start">START DASHING</button>
                <button class="text-btn" id="btn-change">Change User</button>
            </div>

            <div id="login-form">
                <input type="text" id="inp-name" placeholder="Full Name (Letters Only)">
                <input type="tel" id="inp-id" placeholder="Poornata ID (Numbers Only)">
                <button id="btn-login" class="main-btn" disabled>ENTER SKY</button>
            </div>

            <div class="how-to">
                <div class="how-item">👆 <strong>Hold</strong> to Fly. <strong>Lift</strong> to End.</div>
                <div class="how-item">🦠 <strong>Dodge</strong> the Viruses.</div>
                <div class="how-item">🛡️ <strong>Shield</strong> lasts 8 seconds.</div>
            </div>

            <div class="lb" id="menu-lb"></div>
            <div class="text-btn" id="toggle-sound">🔊 Sound: ON</div>
        </div>

        <div id="game-over-screen" class="screen-box">
            <h1 class="title">Dash Over</h1>
            <div id="trivia-box" style="margin:15px 0; font-size:13px; color:#444; line-height:1.4; background:#fff9e6; padding:15px; border-radius:15px; border: 1px solid #ffeeba;"></div>
            
            <div class="lb" id="death-lb"></div>

            <button id="btn-restart" class="main-btn">DASH AGAIN</button>
            <button class="main-btn" id="btn-share" style="background:var(--blue);">SHARE CHALLENGE</button>
            <button class="text-btn" id="btn-menu">Back to Menu</button>
        </div>
    </div>

    <div id="game-hud">
        <div class="hud-top">
            <div class="stat-pill">⭐ <span id="val-score">0</span></div>
            <div class="stat-pill">LVL <span id="val-lvl">1</span></div>
            <div class="stat-pill">High Score: <span id="val-best">0</span></div>
        </div>
        <div id="shield-toast">🛡️ SHIELD: <span id="shield-timer">8.0</span>s</div>
             <div id="game-toast">PLACE FINGER TO START</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let W, H, animId;

    const STATE = {
        phase: 'MENU', score: 0, highscore: 0, level: 1,
        shield: 0, user: null, sound: true,
        bgOffset: 0
    };

    const TRIVIA = [
        "Seamex creates delightful experiences. Read more: https://bit.ly/SeamexStory",
        "Poornata + Seamex = Seamless HR transformation.",
        "Dodge viruses to maintain your streak in the cloud!",
        "Shields give you 8 seconds of pure invincibility.",
        "Seamless Dash is powered by the agile Seamex engine.",
        "Your score helps the Seamex ecosystem grow!"
    ];

    // Audio - Pathing fix: If local, ensure these exist in the same folder
    const audio = {
        bgm: new Audio('bgm.mp3'),
        die: new Audio('Die.mp3'),
        lvl: new Audio('levelup.mp3'),
        pwr: new Audio('powerup.mp3')
    };
    audio.bgm.loop = true;

    let player = { x:0, y:0, r:46, tx:0, ty:0, bob:0 };
    let enemies = [], items = [], clouds = [], streaks = [], particles = [], dots = [];

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        // Background dots
        dots = Array.from({length: 40}, () => ({ x:Math.random()*W, y:Math.random()*H, s:0.5+Math.random(), r:1+Math.random()*2 }));
        // Fresh clouds
        clouds = Array.from({length: 6}, () => ({ x:Math.random()*W, y:Math.random()*H, s:0.8+Math.random()*1.2, w:120+Math.random()*100 }));
        // Wind streaks
        streaks = Array.from({length: 12}, () => ({ x:Math.random()*W, y:Math.random()*H, s:12+Math.random()*8, l:30+Math.random()*40 }));
    }
    window.onresize = resize; resize();

    // Validation
    const nameIn = document.getElementById('inp-name');
    const idIn = document.getElementById('inp-id');
    const loginBtn = document.getElementById('btn-login');
    function validate() {
        const nv = /^[A-Za-z\s]{3,}$/.test(nameIn.value.trim());
        const iv = /^[0-9]{4,10}$/.test(idIn.value.trim());
        loginBtn.disabled = !(nv && iv);
    }
    nameIn.oninput = idIn.oninput = validate;

    // LB & User
    function updateLB() {
        const lb = JSON.parse(localStorage.getItem('seamex_lb_v34') || '[]');
        const html = lb.slice(0, 5).map((e, i) => `<div class="lb-row"><span>#${i+1} ${e.name}</span><strong>${e.score}</strong></div>`).join('') || "No records yet!";
        document.getElementById('menu-lb').innerHTML = html;
        document.getElementById('death-lb').innerHTML = html;
    }
    function initUser() {
        const saved = localStorage.getItem('seamex_user_v34');
        if(saved) {
            STATE.user = JSON.parse(saved);
            document.getElementById('user-name').textContent = STATE.user.name;
            document.getElementById('welcome-back').style.display = 'block';
            document.getElementById('login-form').style.display = 'none';
        }
        updateLB();
    }
    initUser();

    document.getElementById('btn-change').onclick = () => {
        localStorage.removeItem('seamex_user_v34');
        location.reload();
    };

    // GAME LOOP
    function startReady() {
        if(!STATE.user) {
            STATE.user = { name: nameIn.value.trim(), id: idIn.value.trim() };
            localStorage.setItem('seamex_user_v34', JSON.stringify(STATE.user));
        }
        STATE.highscore = localStorage.getItem('seamex_hs_' + STATE.user.id) || 0;
        document.getElementById('val-best').textContent = STATE.highscore;
        STATE.phase = 'READY';
        STATE.score = 0; STATE.level = 1; STATE.shield = 0;
        enemies = []; items = []; particles = [];
        player.x = W/2; player.y = H*0.75;
        document.body.className = 'state-playing';
        if(!animId) loop();
    }

    function endGame() {
        if(STATE.phase !== 'PLAYING') return;
        STATE.phase = 'GAMEOVER';
        audio.bgm.pause();
        if(STATE.sound) audio.die.play().catch(()=>{});
        
        let lb = JSON.parse(localStorage.getItem('seamex_lb_v34') || '[]');
        lb.push({ name: STATE.user.name, score: Math.floor(STATE.score) });
        lb.sort((a,b) => b.score - a.score);
        localStorage.setItem('seamex_lb_v34', JSON.stringify(lb.slice(0, 8)));
        if(STATE.score > STATE.highscore) localStorage.setItem('seamex_hs_' + STATE.user.id, Math.floor(STATE.score));
        
        updateLB();
        document.getElementById('trivia-box').textContent = TRIVIA[Math.floor(Math.random()*TRIVIA.length)];
        document.body.className = 'state-gameover';
    }

    // Input Handling (Ensuring it's on the Canvas)
    const handleDown = (e) => {
        if(STATE.phase === 'READY') { STATE.phase = 'PLAYING'; if(STATE.sound) audio.bgm.play().catch(()=>{}); }
        updateTarget(e);
    };
    const updateTarget = (e) => {
        const t = e.touches ? e.touches[0] : e;
        player.tx = t.clientX; player.ty = t.clientY - 75;
    };
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleDown(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updateTarget(e); });
    canvas.addEventListener('touchend', () => { if(STATE.phase === 'PLAYING') endGame(); });
    canvas.addEventListener('mousedown', handleDown);
    canvas.addEventListener('mouseup', () => { if(STATE.phase === 'PLAYING') endGame(); });

    function spawn() {
        if(STATE.phase !== 'PLAYING') return;
        const rate = 0.015 + (Math.min(STATE.level, 10) * 0.005);
        if(Math.random() < rate) {
            enemies.push({
                x: Math.random()*W, y: -60, r: 22+Math.random()*25, 
                s: 4 + Math.random()*2 + (STATE.level * 0.4),
                img: Math.random() > 0.5 ? document.getElementById('asset-v1') : document.getElementById('asset-v2'),
                rot: Math.random()*6, rs: (Math.random()-0.5)*0.15
            });
        }
        if(Math.random() < 0.004) items.push({ x: Math.random()*W, y: -60, r:30 });
    }

    function createSparks(x, y) {
        for(let i=0; i<8; i++) {
            particles.push({ x, y, vx:(Math.random()-0.5)*12, vy:(Math.random()-0.5)*12, life:1.0, c: '#0984e3' });
        }
    }

    function update() {
        if(STATE.phase === 'READY') {
            player.x = W/2 + Math.sin(Date.now()*0.005)*10;
            player.y = H*0.75 + Math.cos(Date.now()*0.005)*5;
        }
        if(STATE.phase !== 'PLAYING') {
            dots.forEach(d => { d.y += d.s; if(d.y > H) d.y = -10; });
            return;
        }

        STATE.score += 0.15;
        document.getElementById('val-score').textContent = Math.floor(STATE.score);
        document.getElementById('val-lvl').textContent = STATE.level;

        if(Math.floor(STATE.score) > 0 && Math.floor(STATE.score) % 100 === 0 && STATE.score % 1 < 0.16) {
            STATE.level++; if(STATE.sound) audio.lvl.play().catch(()=>{});
        }

        player.bob = Math.sin(Date.now()*0.006) * 6;
        player.x += (player.tx - player.x) * 0.18;
        player.y += (player.ty - player.y) * 0.18;

        if(STATE.shield > 0) {
            STATE.shield--;
            document.getElementById('shield-toast').style.display = 'block';
            document.getElementById('shield-timer').textContent = (STATE.shield/60).toFixed(1);
        } else { document.getElementById('shield-toast').style.display = 'none'; }

        // Parallax Movement
        dots.forEach(d => { d.y += d.s * 2; if(d.y > H) d.y = -10; });
        clouds.forEach(c => { c.y += c.s * 2.5; if(c.y > H + 100) { c.y = -120; c.x = Math.random()*W; } });
        streaks.forEach(st => { st.y += st.s; if(st.y > H) st.y = -100; });

        // Collision Logic
        for(let i=enemies.length-1; i>=0; i--) {
            let e = enemies[i]; e.y += e.s; e.rot += e.rs;
            const d = Math.hypot(player.x - e.x, player.y - (e.y - player.bob));
            if(d < player.r + e.r - 10) {
                if(STATE.shield > 0) { createSparks(e.x, e.y); enemies.splice(i, 1); }
                else { endGame(); return; }
            }
            if(e.y > H + 100) enemies.splice(i,1);
        }
        for(let i=items.length-1; i>=0; i--) {
            let it = items[i]; it.y += 4.5;
            if(Math.hypot(player.x - it.x, player.y - it.y) < 60) {
                STATE.shield = 480; if(STATE.sound) audio.pwr.play().catch(()=>{}); items.splice(i,1);
            }
            if(it.y > H + 100) items.splice(i,1);
        }
        particles.forEach((p,i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.05; if(p.life <= 0) particles.splice(i,1); });
        spawn();
    }

    function draw() {
        // Fresh Good Morning Gradient
        let grad = ctx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0, '#e3f2fd'); grad.addColorStop(1, '#ffffff');
        ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

        // Background dots
        ctx.fillStyle = 'rgba(9, 132, 227, 0.15)';
        dots.forEach(d => { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill(); });

        // Wind Streaks
        ctx.strokeStyle = 'rgba(9, 132, 227, 0.1)'; ctx.lineWidth = 2;
        streaks.forEach(st => { ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(st.x, st.y+st.l); ctx.stroke(); });

        // Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        clouds.forEach(c => { ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w/2, 30, 0, 0, Math.PI*2); ctx.fill(); });

        // Enemies
        enemies.forEach(e => {
            ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
            ctx.drawImage(e.img, -e.r, -e.r, e.r*2, e.r*2); ctx.restore();
        });
        items.forEach(it => ctx.drawImage(document.getElementById('asset-shield'), it.x-30, it.y-30, 60, 60));
        particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; });

        // Player (AVA)
        ctx.save();
        if(STATE.shield > 0) {
            ctx.beginPath(); ctx.arc(player.x, player.y + player.bob, 60, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(9, 132, 227, 0.6)'; ctx.lineWidth = 5; ctx.stroke();
        }
        ctx.drawImage(document.getElementById('asset-player'), player.x-46, player.y-46 + player.bob, 92, 92);
        ctx.restore();
    }

    function loop() { update(); draw(); animId = requestAnimationFrame(loop); }

    // UI LISTENERS
    document.getElementById('btn-login').onclick = startReady;
    document.getElementById('btn-quick-start').onclick = startReady;
    document.getElementById('btn-restart').onclick = startReady;
    document.getElementById('btn-menu').onclick = () => location.reload();
    document.getElementById('toggle-sound').onclick = () => {
        STATE.sound = !STATE.sound;
        document.getElementById('toggle-sound').textContent = STATE.sound ? "🔊 Sound: ON" : "🔇 Sound: OFF";
        if(!STATE.sound) audio.bgm.pause();
    };

    document.getElementById('btn-share').onclick = async () => {
        const msg = `🚀 I dashed past the viruses and scored ${Math.floor(STATE.score)} in Seamless Dash! Can you beat my streak? \n\nDownload the Poornata App to play: https://onelink.to/6kpm3g`;
        if (navigator.share) {
            navigator.share({ title: 'Seamless Dash Challenge', text: msg, url: 'https://onelink.to/6kpm3g' }).catch(()=>{});
        } else {
            await navigator.clipboard.writeText(msg);
            alert("Challenge copied to clipboard!");
        }
    };

    loop();
</script>
</body>
</html>
