<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seamless Dash - Seamex</title>
    <style>
        :root { --red: #A01018; --gold: #FFC107; --sky: #e3f2fd; --blue: #0984e3; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 2; width: 100%; height: 100%; }

        /* UI Layer */
        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; align-items: center; justify-content: center; }
        .screen-box { 
            background: rgba(255, 255, 255, 0.98); padding: 25px; border-radius: 30px; width: 88%; max-width: 360px; 
            text-align: center; pointer-events: auto; box-shadow: 0 15px 45px rgba(0,0,0,0.15); 
            border-top: 8px solid var(--red); display: none; flex-direction: column; max-height: 90vh; overflow-y: auto;
        }

        body.state-menu #start-screen { display: flex; }
        body.state-gameover #game-over-screen { display: flex; }
        body.state-playing #game-hud { display: flex !important; }

        .logo { width: 130px; margin: 0 auto 10px; }
        .title { color: var(--red); font-size: 24px; font-weight: 900; margin: 0; text-transform: uppercase; }
        
        /* Validation Nudges */
        .input-group { margin-bottom: 10px; text-align: left; position: relative; }
        input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .err-nudge { color: var(--red); font-size: 11px; font-weight: bold; margin-top: 4px; visibility: hidden; height: 12px; }

        .main-btn { background: linear-gradient(135deg, var(--gold), var(--red)); color: white; border: none; padding: 16px; border-radius: 50px; font-weight: 800; width: 100%; cursor: pointer; font-size: 16px; margin-top: 5px; }
        .main-btn:disabled { opacity: 0.5; filter: grayscale(1); }
        .text-btn { background: none; border: none; color: var(--red); font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 13px; text-decoration: underline; }

        /* HUD & Toast */
        #game-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; z-index: 5; }
        .hud-top { position: absolute; top: 15px; width: 92%; left: 4%; display: flex; justify-content: space-between; }
        .stat-pill { background: rgba(255,255,255,0.9); padding: 8px 15px; border-radius: 20px; font-weight: 800; color: var(--red); font-size: 12px; border: 1px solid #eee; }
        
        #start-toast { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); color: white; padding: 15px 30px; border-radius: 50px;
            font-weight: 800; font-size: 16px; animation: pulse 1.5s infinite; display: none;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .how-to { background: #f0f9ff; padding: 15px; border-radius: 15px; margin: 15px 0; text-align: left; border: 1px solid #d1e9ff; }
        .lb { background: #f8f9fa; border-radius: 15px; padding: 12px; margin: 10px 0; font-size: 13px; }
    </style>
</head>
<body class="state-menu">

    <div style="display:none;">
        <img id="asset-player" src="character.png">
        <img id="asset-v1" src="icons8-virus-60.png">
        <img id="asset-v2" src="icons8-virus-60 (1).png">
        <img id="asset-shield" src="sheild.png">
        <img id="asset-cloud" src="Cloud.png">
    </div>

    <div id="ui-layer">
        <div id="start-screen" class="screen-box">
            <img src="NEW Seamex logo.png" class="logo">
            <h1 class="title">Seamless Dash</h1>
            
            <div id="welcome-back" style="display:none; margin:15px 0;">
                <div style="font-size:14px; background: #f0f7ff; padding: 10px; border-radius: 12px;">
                    <span id="time-greeting"></span>, <strong id="user-name"></strong>
                </div>
                <button class="main-btn" id="btn-quick-start">START DASHING</button>
                <button class="text-btn" id="btn-change">Change User</button>
            </div>

            <div id="login-form">
                <div class="input-group">
                    <input type="text" id="inp-name" placeholder="Full Name">
                    <div id="err-name" class="err-nudge">Letters only (min 3)</div>
                </div>
                <div class="input-group">
                    <input type="tel" id="inp-id" placeholder="Poornata ID">
                    <div id="err-id" class="err-nudge">Numbers only (4-10 digits)</div>
                </div>
                <button id="btn-login" class="main-btn" disabled>ENTER SKY</button>
            </div>

            <div class="how-to">
                <div style="font-size:11px; color:#999; margin-bottom:5px;">HOW TO PLAY</div>
                <div style="font-size:13px; font-weight:600;">👆 Hold to fly | ✋ Lift to end dash</div>
            </div>

            <div class="lb" id="menu-lb"></div>
            <div class="text-btn" id="toggle-sound">🔊 Sound: ON</div>
        </div>

        <div id="game-over-screen" class="screen-box">
            <h1 class="title">Dash Over</h1>
            <div id="trivia-box" style="margin:15px 0; font-size:13px; background:#fff9e6; padding:15px; border-radius:15px;"></div>
            <div class="lb" id="death-lb"></div>
            <button id="btn-restart" class="main-btn">DASH AGAIN</button>
            <button class="main-btn" id="btn-share" style="background:var(--blue);">SHARE CHALLENGE</button>
            <button class="text-btn" id="btn-menu">Main Menu</button>
        </div>
    </div>

    <div id="game-hud">
        <div class="hud-top">
            <div class="stat-pill">⭐ <span id="val-score">0</span></div>
            <div class="stat-pill">LVL <span id="val-lvl">1</span></div>
            <div class="stat-pill">🚩 <span id="val-best">0</span></div>
        </div>
        <div id="start-toast">PLACE FINGER TO START</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let W, H, animId;

    const STATE = {
        phase: 'MENU', score: 0, highscore: 0, level: 1,
        shield: 0, user: null, sound: true
    };

    const TRIVIA = [
        "Seamex drives agile digital HR transformation. https://bit.ly/SeamexStory",
        "Poornata is your gateway to delightful employee experiences.",
        "Dodge the viruses to keep your Seamex streak alive!",
        "Shields last 8 seconds—use them to blast through obstacles."
    ];

    const audio = {
        bgm: new Audio('bgm.mp3'),
        die: new Audio('Die.mp3'),
        lvl: new Audio('levelup.mp3'),
        pwr: new Audio('powerup.mp3')
    };
    audio.bgm.loop = true;

    let player = { x:0, y:0, r:46, tx:0, ty:0, bob:0 };
    let enemies = [], items = [], clouds = [], streaks = [], particles = [];

    // --- TIME BASED GREETING ---
    function getGreeting() {
        const hour = new Date().getHours();
        if (hour < 12) return "Good morning";
        if (hour < 17) return "Good afternoon";
        return "Good evening";
    }

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        clouds = Array.from({length: 5}, () => ({ x:Math.random()*W, y:Math.random()*H, s:0.5+Math.random(), w:120+Math.random()*60 }));
        streaks = Array.from({length: 10}, () => ({ x:Math.random()*W, y:Math.random()*H, s:10+Math.random()*10, l:30+Math.random()*30 }));
    }
    window.onresize = resize; resize();

    // --- VALIDATION NUDGES ---
    const nameIn = document.getElementById('inp-name');
    const idIn = document.getElementById('inp-id');
    const loginBtn = document.getElementById('btn-login');

    function validate() {
        const nameVal = nameIn.value.trim();
        const idVal = idIn.value.trim();
        
        const isNameValid = /^[A-Za-z\s]{3,}$/.test(nameVal);
        const isIdValid = /^[0-9]{4,10}$/.test(idVal);

        document.getElementById('err-name').style.visibility = (nameVal === "" || isNameValid) ? 'hidden' : 'visible';
        document.getElementById('err-id').style.visibility = (idVal === "" || isIdValid) ? 'hidden' : 'visible';

        loginBtn.disabled = !(isNameValid && isIdValid);
    }
    nameIn.oninput = idIn.oninput = validate;

    // --- USER INIT ---
    function initUser() {
        const saved = localStorage.getItem('seamex_user_v35');
        if(saved) {
            STATE.user = JSON.parse(saved);
            document.getElementById('user-name').textContent = STATE.user.name;
            document.getElementById('time-greeting').textContent = getGreeting();
            document.getElementById('welcome-back').style.display = 'block';
            document.getElementById('login-form').style.display = 'none';
        }
        updateLB();
    }
    initUser();

    function updateLB() {
        const lb = JSON.parse(localStorage.getItem('seamex_lb_v35') || '[]');
        const html = lb.slice(0, 5).map((e, i) => `<div style="display:flex; justify-content:space-between; margin:4px 0;"><span>#${i+1} ${e.name}</span><strong>${e.score}</strong></div>`).join('') || "No records yet";
        document.getElementById('menu-lb').innerHTML = html;
        document.getElementById('death-lb').innerHTML = html;
    }

    // --- GAME LOGIC ---
    function startReady() {
        if(!STATE.user) {
            STATE.user = { name: nameIn.value.trim(), id: idIn.value.trim() };
            localStorage.setItem('seamex_user_v35', JSON.stringify(STATE.user));
        }
        STATE.highscore = localStorage.getItem('seamex_hs_' + STATE.user.id) || 0;
        document.getElementById('val-best').textContent = STATE.highscore;
        STATE.phase = 'READY';
        STATE.score = 0; STATE.level = 1; 
        enemies = []; items = [];
        player.x = W/2; player.y = H*0.75;
        document.body.className = 'state-playing';
        document.getElementById('start-toast').style.display = 'block';
        if(!animId) loop();
    }

    function endGame() {
        if(STATE.phase !== 'PLAYING') return;
        STATE.phase = 'GAMEOVER';
        audio.bgm.pause();
        if(STATE.sound) audio.die.play().catch(()=>{});
        
        let lb = JSON.parse(localStorage.getItem('seamex_lb_v35') || '[]');
        lb.push({ name: STATE.user.name, score: Math.floor(STATE.score) });
        lb.sort((a,b) => b.score - a.score);
        localStorage.setItem('seamex_lb_v35', JSON.stringify(lb.slice(0, 10)));
        if(STATE.score > STATE.highscore) localStorage.setItem('seamex_hs_' + STATE.user.id, Math.floor(STATE.score));
        
        updateLB();
        document.getElementById('trivia-box').textContent = TRIVIA[Math.floor(Math.random()*TRIVIA.length)];
        document.body.className = 'state-gameover';
    }

    const onDown = (e) => {
        if(STATE.phase === 'READY') { 
            STATE.phase = 'PLAYING'; 
            document.getElementById('start-toast').style.display = 'none';
            if(STATE.sound) audio.bgm.play().catch(()=>{}); 
        }
        updateTarget(e);
    };
    const updateTarget = (e) => {
        const t = e.touches ? e.touches[0] : e;
        player.tx = t.clientX; player.ty = t.clientY - 75;
    };
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updateTarget(e); });
    canvas.addEventListener('touchend', () => { if(STATE.phase === 'PLAYING') endGame(); });
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mouseup', () => { if(STATE.phase === 'PLAYING') endGame(); });

    function update() {
        if(STATE.phase === 'READY') {
            player.x = W/2 + Math.sin(Date.now()*0.005)*10;
            player.y = H*0.75;
        }
        if(STATE.phase !== 'PLAYING') {
            clouds.forEach(c => { c.y += c.s * 0.5; if(c.y > H + 50) c.y = -60; });
            return;
        }

        STATE.score += 0.15;
        document.getElementById('val-score').textContent = Math.floor(STATE.score);
        
        player.bob = Math.sin(Date.now()*0.006) * 6;
        player.x += (player.tx - player.x) * 0.18;
        player.y += (player.ty - player.y) * 0.18;

        if(STATE.shield > 0) STATE.shield--;

        clouds.forEach(c => { c.y += c.s * 2; if(c.y > H + 50) { c.y = -60; c.x = Math.random()*W; } });
        streaks.forEach(st => { st.y += st.s; if(st.y > H) st.y = -100; });

        for(let i=enemies.length-1; i>=0; i--) {
            let e = enemies[i]; e.y += e.s;
            const d = Math.hypot(player.x - e.x, player.y - (e.y - player.bob));
            if(d < player.r + e.r - 10) {
                if(STATE.shield > 0) { enemies.splice(i,1); }
                else { endGame(); return; }
            }
            if(e.y > H + 100) enemies.splice(i,1);
        }
        
        // Spawn
        if(Math.random() < 0.02) enemies.push({ x:Math.random()*W, y:-60, r:25, s:4 + (STATE.score/200), img:Math.random()>0.5?document.getElementById('asset-v1'):document.getElementById('asset-v2') });
        if(Math.random() < 0.003) items.push({ x:Math.random()*W, y:-60, r:30 });
    }

    function draw() {
        let grad = ctx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0, '#e3f2fd'); grad.addColorStop(1, '#ffffff');
        ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

        // Clouds (Asset Based)
        clouds.forEach(c => ctx.drawImage(document.getElementById('asset-cloud'), c.x - c.w/2, c.y, c.w, c.w/2));

        // Streaks
        ctx.strokeStyle = 'rgba(9, 132, 227, 0.1)'; ctx.lineWidth = 2;
        streaks.forEach(st => { ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(st.x, st.y+st.l); ctx.stroke(); });

        enemies.forEach(e => ctx.drawImage(e.img, e.x-e.r, e.y-e.r, e.r*2, e.r*2));
        
        // Player
        ctx.save();
        if(STATE.shield > 0) {
            ctx.beginPath(); ctx.arc(player.x, player.y + player.bob, 60, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(9, 132, 227, 0.6)'; ctx.lineWidth = 5; ctx.stroke();
        }
        ctx.drawImage(document.getElementById('asset-player'), player.x-46, player.y-46 + player.bob, 92, 92);
        ctx.restore();
    }

    function loop() { update(); draw(); animId = requestAnimationFrame(loop); }

    document.getElementById('btn-login').onclick = startReady;
    document.getElementById('btn-quick-start').onclick = startReady;
    document.getElementById('btn-restart').onclick = startReady;
    document.getElementById('btn-menu').onclick = () => location.reload();
    document.getElementById('btn-change').onclick = () => { localStorage.removeItem('seamex_user_v35'); location.reload(); };
    document.getElementById('btn-share').onclick = () => {
        const msg = `🚀 I dashed past the viruses and scored ${Math.floor(STATE.score)} in Seamless Dash! Challenge: https://onelink.to/6kpm3g`;
        if (navigator.share) navigator.share({ text: msg });
        else { navigator.clipboard.writeText(msg); alert("Copied!"); }
    };

    loop();
</script>
</body>
</html>
